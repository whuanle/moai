# 临时探针：验证 tag 触发 + concurrency 结构是否被本机 Gitea/act 接受（验证后删除）
name: probe-tag
on:
  push:
    tags: ['ta*']
concurrency:
  group: probe-tag
  cancel-in-progress: false
jobs:
  probe:
    runs-on: linux_local
    timeout-minutes: 5
    steps:
      - name: hello
        run: |
          set -euo pipefail
          echo "probe ok: $GITHUB_REF / $GITHUB_REF_NAME"
