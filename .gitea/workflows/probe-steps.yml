name: probe-steps
'on':
  push:
    tags:
      - pz*
env:
  IMAGE_NAME: moai
  ZOT_REGISTRY: ${{ vars.ZOT_REGISTRY }}
  ZOT_REGISTRY_URL: ${{ vars.ZOT_REGISTRY_URL }}
  ZOT_USERNAME: ${{ vars.ZOT_USERNAME }}
  ZOT_PASSWORD: ${{ secrets.ZOT_PASSWORD }}
  ZOT_REGISTRY_TARGET: ${{ vars.ZOT_REGISTRY_TARGET || vars.ZOT_REGISTRY }}
  MINI_SSH_USER: ${{ vars.MINI_SSH_USER }}
  MINI_SSH_RSA: ${{ secrets.MINI_SSH_RSA }}
  MINI_SSH_HOST: ${{ vars.MINI_SSH_HOST }}
  MINI_SSH_PORT: ${{ vars.MINI_SSH_PORT }}
  MINI_SSH_KNOWN_HOST: ${{ vars.MINI_SSH_KNOWN_HOST }}
  MOAI_APP_DIR: ${{ vars.MOAI_APP_DIR || 'moai' }}
  GITHUB_SERVER_URL: ${{ github.server_url }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_SHA: ${{ github.sha }}
  GITHUB_REF: ${{ github.ref }}
  GITHUB_REF_NAME: ${{ github.ref_name }}
jobs:
  step1:
    runs-on: linux_local
    timeout-minutes: 10
    steps:
      - name: 校验仓库变量与密钥
        run: |
          set -euo pipefail
          missing=""
          for name in ZOT_REGISTRY ZOT_USERNAME ZOT_PASSWORD MINI_SSH_USER MINI_SSH_RSA MINI_SSH_HOST MINI_SSH_PORT; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "缺少仓库变量/密钥:$missing"
            echo "在 Gitea 仓库 → 设置 → Actions 补齐："
            echo "  变量：ZOT_REGISTRY ZOT_REGISTRY_URL ZOT_USERNAME MINI_SSH_USER MINI_SSH_HOST MINI_SSH_PORT"
            echo "  密钥：ZOT_PASSWORD MINI_SSH_RSA"
            exit 1
          fi
          echo "变量与密钥齐备（部署目标已脱敏，不在日志中回显）"
  step2:
    runs-on: linux_local
    timeout-minutes: 10
    steps:
      - name: 解析镜像 tag
        run: |
          set -euo pipefail
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          case "$GITHUB_REF" in
            refs/tags/*)
              # tag 触发：镜像版本 = 去掉前缀 v 的 tag 名，且必须是 X.Y.Z
              TAG="${GITHUB_REF_NAME#v}"
              if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "tag $GITHUB_REF_NAME 不符合 X.Y.Z / vX.Y.Z 格式" >&2
                exit 1
              fi
              ;;
            *)
              TAG="${{ inputs.image_tag }}"
              if [ -z "$TAG" ]; then TAG="sha-$SHORT_SHA"; fi
              ;;
          esac
          case "$TAG" in *[!A-Za-z0-9._-]*) echo "非法 tag：$TAG"; exit 1;; esac
          { echo "IMAGE_TAG=$TAG"; echo "SHORT_SHA=$SHORT_SHA"; } >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] || printf '%s' "$GITHUB_REF" | grep -q '^refs/tags/'; then
            echo "触发方式：tag ${GITHUB_REF_NAME}"
          else
            echo "触发方式：手动（${GITHUB_REF_NAME}）"
          fi
          echo "本次提交：${SHORT_SHA}"
          echo "推送镜像：${ZOT_REGISTRY}/${IMAGE_NAME}:${TAG}（同时打 :sha-${SHORT_SHA} 与 :latest，便于回滚）"
  step3:
    runs-on: linux_local
    timeout-minutes: 10
    steps:
      - name: 准备源码
        if: ${{ inputs.deploy_only != 'true' }}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/moai-src"
          rm -rf "$SRC" && mkdir -p "$SRC"
          # 用 Actions 自动注入的 token 走 HTTP 拉本仓库（不依赖第三方 action）
          curl -fsSL -H "Authorization: token ${{ github.token }}" \
            "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz" \
            -o "$RUNNER_TEMP/moai-src.tar.gz"
          tar -xzf "$RUNNER_TEMP/moai-src.tar.gz" --strip-components=1 -C "$SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          ls "$SRC" | head -20
          test -f "$SRC/Dockerfile"
