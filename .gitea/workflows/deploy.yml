# ============================================================
# MoAI main 分支自动构建并部署（Gitea Actions）
#
# 分工：
#   - GitHub（.github/workflows/docker-publish.yml）：只在打 tag 时发布生产镜像到 Docker Hub
#   - Gitea（本文件）：示例服务器，main 分支每次 push 自动构建并部署
#
# 与 mo_platform 的 .gitea/workflows/build-image.yml 同构：
#   1) build-push：buildx 构建前后端一体镜像，推送到内网 Zot（纯 HTTP LAN）
#   2) deploy：经 SSH 把 compose 文件同步到目标机，登录 Zot 拉镜像 → 复用/完整栈 compose 切换
#
# 触发：
#   1) push 到 main 分支自动构建并部署（镜像 tag = sha-<短哈希>，同时更新 :latest）
#   2) Gitea 仓库页 → Actions → deploy-moai → Run workflow（可切分支/指定 tag 重放或回滚）
#
# 变量来源：Gitea 仓库「设置 → Actions」（仓库级变量/密钥，非全局变量）
#   变量（Variables）：
#     ZOT_REGISTRY / ZOT_REGISTRY_URL / ZOT_USERNAME
#     MINI_SSH_USER / MINI_SSH_HOST / MINI_SSH_PORT
#   密钥（Secrets）：
#     ZOT_PASSWORD（registry 密码/token）
#     MINI_SSH_RSA（部署机 SSH 私钥全文）
#   公开仓库不写死任何地址：仓库文件里只有占位符，真实值只在仓库变量/密钥与部署机本地。
# 可选变量（缺省走默认值）：
#   ZOT_REGISTRY_TARGET  部署机视角的 registry（默认同 ZOT_REGISTRY）
#   MINI_SSH_KNOWN_HOST  目标机 known_hosts 行（建议配置，避免首次指纹信任）
#   MOAI_APP_DIR         目标机部署目录（相对 $HOME），默认 moai
# ============================================================
name: deploy-moai

on:
  push:
    # main 即示例服务器环境：合并/提交到 main 就直接构建并部署
    branches: ['main']
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 tag（留空 = sha-<短哈希>）'
        required: false
        default: ''
      deploy_only:
        description: '跳过构建，仅部署 registry 上已有的 tag（true / false）'
        required: false
        default: 'false'

concurrency:
  # 连续提交时只保留最新的构建部署：取消排队中的旧提交，避免示例服务器被过期代码覆盖
  group: deploy-moai
  cancel-in-progress: true

env:
  IMAGE_NAME: moai
  # 仓库「设置 → Actions」：变量走 vars.*，密钥走 secrets.*（与 mo_platform 同名）
  ZOT_REGISTRY: ${{ vars.ZOT_REGISTRY }}
  ZOT_REGISTRY_URL: ${{ vars.ZOT_REGISTRY_URL }}
  ZOT_USERNAME: ${{ vars.ZOT_USERNAME }}
  ZOT_PASSWORD: ${{ secrets.ZOT_PASSWORD }}
  ZOT_REGISTRY_TARGET: ${{ vars.ZOT_REGISTRY_TARGET || vars.ZOT_REGISTRY }}
  MINI_SSH_USER: ${{ vars.MINI_SSH_USER }}
  MINI_SSH_RSA: ${{ secrets.MINI_SSH_RSA }}
  MINI_SSH_HOST: ${{ vars.MINI_SSH_HOST }}
  MINI_SSH_PORT: ${{ vars.MINI_SSH_PORT }}
  MINI_SSH_KNOWN_HOST: ${{ vars.MINI_SSH_KNOWN_HOST }}
  MOAI_APP_DIR: ${{ vars.MOAI_APP_DIR || 'moai' }}
  # Gitea 不保证把这几项注入到 shell 环境（mo_platform 也是显式映射），这里统一补齐，
  # 避免 set -u 下取未定义变量直接退出
  GITHUB_SERVER_URL: ${{ github.server_url }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_SHA: ${{ github.sha }}
  GITHUB_REF: ${{ github.ref }}
  GITHUB_REF_NAME: ${{ github.ref_name }}

jobs:
  build-and-deploy:
    runs-on: linux_local
    timeout-minutes: 120
    steps:
      - name: 校验仓库变量与密钥
        run: |
          set -euo pipefail
          missing=""
          for name in ZOT_REGISTRY ZOT_USERNAME ZOT_PASSWORD MINI_SSH_USER MINI_SSH_RSA MINI_SSH_HOST MINI_SSH_PORT; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "缺少仓库变量/密钥:$missing"
            echo "在 Gitea 仓库 → 设置 → Actions 补齐："
            echo "  变量：ZOT_REGISTRY ZOT_REGISTRY_URL ZOT_USERNAME MINI_SSH_USER MINI_SSH_HOST MINI_SSH_PORT"
            echo "  密钥：ZOT_PASSWORD MINI_SSH_RSA"
            exit 1
          fi
          echo "变量与密钥齐备（部署目标已脱敏，不在日志中回显）"

      - name: 解析镜像 tag
        run: |
          set -euo pipefail
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          # main push 用提交哈希作镜像版本；手动触发可显式指定（回滚/重放）
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="sha-$SHORT_SHA"; fi
          case "$TAG" in *[!A-Za-z0-9._-]*) echo "非法 tag：$TAG"; exit 1;; esac
          { echo "IMAGE_TAG=$TAG"; echo "SHORT_SHA=$SHORT_SHA"; } >> "$GITHUB_ENV"
          echo "触发：${GITHUB_REF_NAME}（${GITHUB_REF}）"
          echo "本次提交：${SHORT_SHA}"
          echo "推送镜像：${ZOT_REGISTRY}/${IMAGE_NAME}:${TAG}（同时打 :sha-${SHORT_SHA} 与 :latest，便于回滚）"

      - name: 构建并推送到 Zot
        if: ${{ inputs.deploy_only != 'true' }}
        run: |
          set -euo pipefail
          # builder 名称带 registry 指纹：buildkitd.toml 只在 create 时生效，如果一直复用
          # 旧的 moai builder，换 registry 地址后就会按 https 去敲纯 HTTP 端口
          # （报 http: server gave HTTP response to HTTPS client）。换地址即换 builder。
          BUILDER_NAME="moai-$(printf '%s' "$ZOT_REGISTRY" | tr -c 'A-Za-z0-9' '-')"
          DOCKER_CONFIG_DIR="$RUNNER_TEMP/zot-docker-config"
          BUILDKITD_CONFIG="$RUNNER_TEMP/moai-buildkitd.toml"
          cleanup() { rm -rf "$DOCKER_CONFIG_DIR" "$BUILDKITD_CONFIG"; }
          trap cleanup EXIT

          mkdir -p "$DOCKER_CONFIG_DIR"
          AUTH="$(printf '%s:%s' "$ZOT_USERNAME" "$ZOT_PASSWORD" | base64 | tr -d '\n')"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$ZOT_REGISTRY" "$AUTH" > "$DOCKER_CONFIG_DIR/config.json"
          chmod 600 "$DOCKER_CONFIG_DIR/config.json"
          export DOCKER_CONFIG="$DOCKER_CONFIG_DIR"

          IMAGE="$ZOT_REGISTRY/$IMAGE_NAME"

          # 构建机要访问的 registry 可能不止一个（ZOT_REGISTRY 推送、ZOT_REGISTRY_URL 可能是
          # 另一个可达地址/同名不同入口），全部按纯 HTTP + insecure 声明。
          REGISTRY_HOSTS="$ZOT_REGISTRY"
          if [ -n "${ZOT_REGISTRY_URL:-}" ]; then
            extra_host="${ZOT_REGISTRY_URL#*://}"
            extra_host="${extra_host%%/*}"
            if [ -n "$extra_host" ] && ! printf ' %s ' "$REGISTRY_HOSTS" | grep -Fq " $extra_host "; then
              REGISTRY_HOSTS="$REGISTRY_HOSTS $extra_host"
            fi
          fi

          {
            for host in $REGISTRY_HOSTS; do
              printf '[registry."%s"]\nhttp = true\ninsecure = true\n\n' "$host"
            done
            printf '[registry."docker.io"]\nmirrors = ["docker.m.daocloud.io"]\n'
          } > "$BUILDKITD_CONFIG"

          if docker buildx inspect "$BUILDER_NAME" >/dev/null 2>&1; then
            echo "复用 Buildx builder $BUILDER_NAME 及其层缓存"
          else
            docker buildx create \
              --name "$BUILDER_NAME" \
              --driver docker-container \
              --driver-opt network=host \
              --driver-opt image=moby/buildkit:buildx-stable-1 \
              --buildkitd-config "$BUILDKITD_CONFIG"
          fi
          docker buildx inspect --bootstrap "$BUILDER_NAME"

          BUILD_LOG="$RUNNER_TEMP/buildx-build.log"
          SHORT_SHA="${SHORT_SHA:-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)}"
          TAG_ARGS=(-t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:sha-$SHORT_SHA" -t "$IMAGE:latest")
          # 构建上下文用 git 远程地址（与 mo_platform 同款）：由 BuildKit 自己 clone 该 commit，
          # 宿主不需要 curl/wget/git，也不需要把源码落到本地磁盘。
          BUILD_CONTEXT="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git#$GITHUB_SHA"
          if docker buildx build \
            --builder "$BUILDER_NAME" \
            --progress=plain \
            --push \
            --provenance=false \
            --sbom=false \
            --cache-from "type=registry,ref=$IMAGE:latest" \
            --cache-to "type=inline,mode=max" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            "${TAG_ARGS[@]}" \
            "$BUILD_CONTEXT" >"$BUILD_LOG" 2>&1; then
            tail -n 30 "$BUILD_LOG"
          else
            echo '构建失败，最后 160 行：' >&2
            tail -n 160 "$BUILD_LOG" >&2
            exit 1
          fi
          echo "已推送：${TAG_ARGS[*]}"

      - name: 部署到目标机
        env:
          # 传给容器内部脚本，控制“是否同步 compose 文件”
          DEPLOY_ONLY: ${{ inputs.deploy_only }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.deploy_only }}" = "true" ]; then
            TAG="${{ inputs.image_tag }}"; TAG="${TAG:-latest}"
          else
            TAG="$IMAGE_TAG"
          fi
          # 部署机视角的 registry：ZOT_REGISTRY_TARGET > ZOT_REGISTRY_URL 的 host:port > ZOT_REGISTRY。
          # 构建机可推、部署机不可达时（如 Zot 在 .193、公网只通 .199 再转发），只配 ZOT_REGISTRY_URL 
          # 就能让拉取地址自动切换，不需要额外再加一个变量。
          DEPLOY_REGISTRY="${ZOT_REGISTRY_TARGET:-}"
          if [ -z "$DEPLOY_REGISTRY" ] && [ -n "${ZOT_REGISTRY_URL:-}" ]; then
            DEPLOY_REGISTRY="${ZOT_REGISTRY_URL#*://}"
            DEPLOY_REGISTRY="${DEPLOY_REGISTRY%%/*}"
          fi
          [ -n "$DEPLOY_REGISTRY" ] || DEPLOY_REGISTRY="$ZOT_REGISTRY"
          IMAGE_REF="$DEPLOY_REGISTRY/$IMAGE_NAME:$TAG"
          echo "DEPLOY_IMAGE=$IMAGE_REF" >> "$GITHUB_ENV"

          # 与 mo_platform 同款：下载归档（node fetch）、解包、打包、SSH 全部在 node 容器内完成，
          # 宿主只需要 docker（不需要 curl / wget / git / tar）。归档匿名可取，Gitea 的
          # github.token 不适用于该下载口（带上反而 401），故不带 Authorization 头。
          docker run --rm -i --network host \
            -v /usr/bin/ssh:/host/ssh:ro \
            -v /usr/lib/x86_64-linux-gnu:/host/lib:ro \
            -v /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2:/host/ld-linux:ro \
            -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e DEPLOY_ONLY \
            -e MINI_SSH_USER -e MINI_SSH_RSA -e MINI_SSH_HOST -e MINI_SSH_PORT -e MINI_SSH_KNOWN_HOST \
            -e MOAI_APP_DIR -e MOAI_IMAGE_REF="$IMAGE_REF" \
            -e ZOT_REGISTRY_TARGET -e ZOT_REGISTRY_URL -e ZOT_USERNAME -e ZOT_PASSWORD \
            node:22-bookworm-slim bash -s <<'SH'
          set -euo pipefail

          # 仅挂载宿主 ssh 二进制（node slim 镜像不带 ssh 客户端）
          cat > /tmp/ssh <<'SSH'
          #!/bin/sh
          exec /host/ld-linux --library-path /host/lib /host/ssh "$@"
          SSH
          chmod 755 /tmp/ssh
          export PATH="/tmp:$PATH"

          key=/tmp/deploy_key; kh=/tmp/known_hosts
          printf '%s\n' "$MINI_SSH_RSA" > "$key"; chmod 600 "$key"
          if [ -n "${MINI_SSH_KNOWN_HOST:-}" ]; then
            printf '%s\n' "$MINI_SSH_KNOWN_HOST" > "$kh"
            hostkey=StrictHostKeyChecking=yes
          else
            : > "$kh"
            hostkey=StrictHostKeyChecking=accept-new
          fi
          rssh() {
            ssh -i "$key" -p "$MINI_SSH_PORT" \
                -o UserKnownHostsFile="$kh" -o "$hostkey" \
                -o ConnectTimeout=20 \
                "$MINI_SSH_USER@$MINI_SSH_HOST" "$@"
          }

          # 取源码快照：构建与“仅部署”都需要其中的 remote-deploy.sh。
          # 用 node:http(s) 直连并关闭链校验：内网 Gitea 常见自签/内部 CA 证书，
          # 容器里没有对应根证书（Node 也不读 Windows 证书库），而这里是匿名只读归档下载。
          echo "==> 下载源码归档：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz"
          node - <<'NODE'
          const fs = require('node:fs');
          const http = require('node:http');
          const https = require('node:https');
          const url = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/archive/${process.env.GITHUB_SHA}.tar.gz`;

          function get(target, redirects = 5) {
            return new Promise((resolve, reject) => {
              const lib = target.startsWith('https:') ? https : http;
              const req = lib.get(target, { rejectUnauthorized: false }, (res) => {
                const status = res.statusCode || 0;
                if ([301, 302, 303, 307, 308].includes(status) && res.headers.location && redirects > 0) {
                  res.resume();
                  resolve(get(new URL(res.headers.location, target).toString(), redirects - 1));
                  return;
                }
                if (status !== 200) {
                  res.resume();
                  reject(new Error(`archive download failed: HTTP ${status} (${target})`));
                  return;
                }
                resolve(res);
              });
              req.on('error', reject);
            });
          }

          (async () => {
            const res = await get(url);
            const out = fs.createWriteStream('/tmp/moai-src.tar.gz');
            await new Promise((resolve, reject) => {
              res.pipe(out);
              out.on('finish', resolve);
              out.on('error', reject);
              res.on('error', reject);
            });
            console.log(`==> 已下载 ${fs.statSync('/tmp/moai-src.tar.gz').size} 字节`);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          rm -rf /tmp/moai-src && mkdir -p /tmp/moai-src
          tar -xzf /tmp/moai-src.tar.gz --strip-components=1 -C /tmp/moai-src
          test -f /tmp/moai-src/deploy/gitea/remote-deploy.sh

          # 1) 同步 compose 相关文件（以仓库为准；不覆盖 .env / configs）
          if [ "${DEPLOY_ONLY:-false}" != "true" ]; then
            tar -C /tmp/moai-src -czf - \
              docker-compose.yml \
              docker-compose.reuse.yml \
              init-pgvector.sql \
              deploy/deploy-compose.sh \
              deploy/opensandbox/sandbox.toml \
              .env.example \
            | rssh "mkdir -p ~/$MOAI_APP_DIR/deploy/opensandbox ~/$MOAI_APP_DIR/configs && tar -xzf - -C ~/$MOAI_APP_DIR"
            echo "==> compose 文件已同步到 ~/$MOAI_APP_DIR"
          fi

          # 2) 执行目标机部署脚本（登录 Zot → pull → 复用/完整栈切换 → 探活回滚）
          {
            printf 'export MOAI_IMAGE_REF=%q MOAI_APP_DIR=%q MOAI_PULL=1 ZOT_REGISTRY_TARGET=%q ZOT_REGISTRY_URL=%q ZOT_USERNAME=%q ZOT_PASSWORD=%q\n' \
              "$MOAI_IMAGE_REF" "$MOAI_APP_DIR" "$ZOT_REGISTRY_TARGET" "$ZOT_REGISTRY_URL" "$ZOT_USERNAME" "$ZOT_PASSWORD"
            cat /tmp/moai-src/deploy/gitea/remote-deploy.sh
          } | rssh bash
          SH

      - name: 结果汇总
        run: |
          {
            echo "### MoAI 部署完成"
            echo ""
            echo "- 触发：\`${GITHUB_REF}\`"
            echo "- 分支/提交：\`${GITHUB_REF_NAME}\` @ \`${SHORT_SHA}\`"
            echo "- 镜像：\`${DEPLOY_IMAGE:-registry 上已有 tag}\`"
            echo "- 目标机：\`***\` 目录 \`~/$MOAI_APP_DIR\`（地址取仓库变量，不回显）"
            echo "- 仅部署（未构建）：\`${{ inputs.deploy_only }}\`"
          } >> "$GITHUB_STEP_SUMMARY" || true
