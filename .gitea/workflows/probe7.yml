name: probe-envcheck
on:
  push:
    tags: ['th*']
env:
  ZOT_REGISTRY: ${{ vars.ZOT_REGISTRY }}
  ZOT_REGISTRY_URL: ${{ vars.ZOT_REGISTRY_URL }}
  ZOT_USERNAME: ${{ vars.ZOT_USERNAME }}
  ZOT_PASSWORD: ${{ secrets.ZOT_PASSWORD }}
  MINI_SSH_USER: ${{ vars.MINI_SSH_USER }}
  MINI_SSH_RSA: ${{ secrets.MINI_SSH_RSA }}
  MINI_SSH_HOST: ${{ vars.MINI_SSH_HOST }}
  MINI_SSH_PORT: ${{ vars.MINI_SSH_PORT }}
jobs:
  check-zot-registry:
    runs-on: linux_local
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          [ -n "${ZOT_REGISTRY:-}" ] || { echo MISSING; exit 1; }
          echo SET
  check-zot-registry-url:
    runs-on: linux_local
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          [ -n "${ZOT_REGISTRY_URL:-}" ] || { echo MISSING; exit 1; }
          echo SET
  check-zot-username:
    runs-on: linux_local
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          [ -n "${ZOT_USERNAME:-}" ] || { echo MISSING; exit 1; }
          echo SET
  check-zot-password:
    runs-on: linux_local
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          [ -n "${ZOT_PASSWORD:-}" ] || { echo MISSING; exit 1; }
          echo SET
  check-mini-ssh-user:
    runs-on: linux_local
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          [ -n "${MINI_SSH_USER:-}" ] || { echo MISSING; exit 1; }
          echo SET
  check-mini-ssh-rsa:
    runs-on: linux_local
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          [ -n "${MINI_SSH_RSA:-}" ] || { echo MISSING; exit 1; }
          echo SET
  check-mini-ssh-host:
    runs-on: linux_local
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          [ -n "${MINI_SSH_HOST:-}" ] || { echo MISSING; exit 1; }
          echo SET
  check-mini-ssh-port:
    runs-on: linux_local
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          [ -n "${MINI_SSH_PORT:-}" ] || { echo MISSING; exit 1; }
          echo SET
