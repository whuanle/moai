# 临时探针 2：workflow 级 env 用 vars/secrets 上下文（验证后删除）
name: probe-env
on:
  push:
    tags: ['tb*']
env:
  A_TEST: ${{ vars.PROBE_A }}
  B_TEST: ${{ secrets.PROBE_B }}
  C_TEST: ${{ vars.PROBE_C || vars.PROBE_A }}
jobs:
  probe:
    runs-on: linux_local
    timeout-minutes: 5
    steps:
      - name: hello
        run: |
          set -euo pipefail
          echo "probe-env ok"
