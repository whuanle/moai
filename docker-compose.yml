# ============================================================
# MoAI 一体部署（docker compose）
#   postgres(pgvector) + redis + rabbitmq + rustfs(S3/OSS) + opensandbox-server + moai
#
# 说明：
#   - moai 镜像内含前端静态资源（wwwroot），由 .NET 同源托管，无前后端分离。
#   - 配置由 deploy-compose.sh 按 .env 生成（默认 ./configs/system.json）并挂载进容器
#   - 图数据库（Memgraph/Neo4j）不内置，知识图谱按需接入（见 docs/deployment/docker.md）
#   - 启动：cp .env.example .env && bash deploy/deploy-compose.sh
# ============================================================
name: moai

services:
  # PostgreSQL 数据库 (带 pgvector 向量扩展)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: moai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moai123456}
      POSTGRES_DB: ${POSTGRES_DB:-moai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moai-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: moai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moai-network

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: moai-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - moai-network

  # RustFS 对象存储（S3 兼容，替代 MinIO）
  # 控制台：http://<host>:9001    S3 API：http://<host>:9000
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    container_name: moai-rustfs
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-moaiadmin}
      RUSTFS_SECRET_KEY: ${S3_ACCESS_KEY_SECRET:-moaiadmin123}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      # 允许浏览器跨域直传（预签名 PUT/GET）。生产建议填 MoAI 站点源，如 https://moai.example.com
      # 若前置 Caddy/nginx 已加 CORS 头，请置空避免 Access-Control-Allow-Origin 重复（*, *）
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-*}
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs/
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/var/log/rustfs
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    networks:
      - moai-network

  # 初始化 RustFS 存储桶（幂等；等待 rustfs 就绪后建桶）
  # 注：不用 minio/mc（其镜像基于 ubi-micro，无 shell）；aws-cli 镜像自带 sh。
  rustfs-init:
    image: ${RUSTFS_INIT_IMAGE:-amazon/aws-cli:latest}
    container_name: moai-rustfs-init
    restart: "no"
    depends_on:
      rustfs:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        export AWS_ACCESS_KEY_ID="$$S3_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$$S3_ACCESS_KEY_SECRET"
        export AWS_DEFAULT_REGION="$$S3_REGION"
        until aws --endpoint-url "http://rustfs:9000" s3api list-buckets >/dev/null 2>&1; do
          echo "waiting for rustfs ..."
          sleep 2
        done
        if ! aws --endpoint-url "http://rustfs:9000" s3api head-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1; then
          aws --endpoint-url "http://rustfs:9000" s3 mb "s3://$$S3_BUCKET"
        fi
        echo "RustFS bucket $$S3_BUCKET ready"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-moaiadmin}
      S3_ACCESS_KEY_SECRET: ${S3_ACCESS_KEY_SECRET:-moaiadmin123}
      S3_BUCKET: ${S3_BUCKET:-moai}
      S3_REGION: ${S3_REGION:-us-east-1}
    networks:
      - moai-network

  # OpenSandbox 生命周期服务（独立镜像；不把 python/docker 塞进 .NET 服务，避免容器逃逸面扩大）
  # 通过挂载宿主机 docker.sock 按需创建沙箱容器；控制台 API：http://<host>:18123
  opensandbox-server:
    image: ${OPENSANDBOX_SERVER_IMAGE:-opensandbox/server:latest}
    container_name: moai-opensandbox
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OPENSANDBOX_PORT:-18123}:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/opensandbox/sandbox.toml:/etc/opensandbox/config.toml:ro
      - opensandbox_data:/var/lib/opensandbox
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      # sandbox.toml 未配置 api_key 时必须显式确认（非交互容器）
      OPENSANDBOX_INSECURE_SERVER: ${OPENSANDBOX_INSECURE_SERVER:-YES}
    networks:
      - moai-network

  # 沙箱镜像（仅用于预拉取，不参与运行）：docker compose --profile sandbox-images pull sandbox-image
  sandbox-image:
    image: ${OPENSANDBOX_SANDBOX_IMAGE:-opensandbox/code-interpreter:v1.1.0}
    profiles: ["sandbox-images"]
    entrypoint: ["/bin/true"]
    restart: "no"

  # MoAI 后端服务（内含前端静态资源，同源托管）
  moai:
    image: ${MOAI_IMAGE:-whuanle/moai:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moai
    restart: unless-stopped
    extra_hosts:
      # 沙箱直连模式：服务端返回的沙箱地址为 host.docker.internal:<port>
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MAI_FILE=/app/configs/system.json
      - TZ=${TZ:-Asia/Shanghai}
      # system.json 占位符替换（仅无挂载时的内置模板需要）
      - MOAI_SERVER_URL=${MOAI_SERVER_URL:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
    volumes:
      # 配置穿透映射（宿主机文件必须存在，否则 docker 会创建同名目录）；
      # 源路径由 .env 的 MOAI_CONFIG_FILE 指定，默认 ./configs/system.json
      - ${MOAI_CONFIG_FILE:-./configs/system.json}:/app/configs/system.json:ro
      - moai_files:/app/files
    ports:
      - "${MOAI_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      opensandbox-server:
        condition: service_started
    networks:
      - moai-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  rustfs_data:
  rustfs_logs:
  opensandbox_data:
  moai_files:

networks:
  moai-network:
    driver: bridge
